LABEL arch
TEXT HELP
Boot the SakuraOS install medium on BIOS.
It allows you to install SakuraOS or perform system maintenance.
ENDTEXT
MENU LABEL Try or install SakuraOS
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the SakuraOS install medium on BIOS with speakup screen reader.
It allows you to install SakuraOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Try or install SakuraOS with ^screen reader
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
