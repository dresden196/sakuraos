# Live session: drop straight into Plasma Wayland, no login prompt.
# Relogin=false means logging out returns to the greeter rather than looping
# back into the session, which is what you want when testing an install.
[Autologin]
User=sakura
Session=plasma.desktop
Relogin=false

# Wayland greeter — Sakura is Wayland by default, and this avoids pulling the
# whole Xorg server onto the live media just to draw a login screen.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --no-lockscreen --no-global-shortcuts --locale1
