# Live session only: drop straight into Plasma, no login prompt.
# Relogin=false means logging out returns to the greeter rather than looping
# back into the session, which is what you want when testing an install.
#
# Theme and greeter settings are NOT repeated here -- they come from
# sakura-theme, so the live media and an installed system look identical.
[Autologin]
User=sakura
Session=plasma.desktop
Relogin=false
