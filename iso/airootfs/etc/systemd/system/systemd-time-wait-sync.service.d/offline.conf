# systemd-time-wait-sync ships with TimeoutStartSec=infinity, and with no route
# out the clock never synchronises -- so the unit activates for as long as the
# machine is on. Everything ordered after time-sync.target then never runs, and
# pacman-init.service is ordered after it. That is what builds the live
# keyring.
#
# The symptom has nothing to do with clocks, which is why it took a while to
# find. Without a keyring pacman cannot verify the signed repository on our own
# media, so the installer cannot tell whether the tuned kernel is present, and
# every offline install quietly fell back to the stock one on hardware that
# could run the tuned kernel.
#
# A bound rather than a removal. Online the clock still synchronises long
# before any signature is checked, which is the thing upstream enables this
# for. Offline the unit gives up after a bounded wait and we use the RTC, which
# is what a machine with no network has anyway. time-sync.target is only
# ordered after this unit rather than dependent on it, so the unit failing lets
# the rest of the boot carry on.
[Service]
TimeoutStartSec=45s
