<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 64" width="140" height="64">
  <!-- Drawn here rather than taken from elsewhere. The Btrfs logo is
       available only as a non-free "fair use" file, which is a doctrine for
       quoting inside an encyclopedia article and not a licence to ship a mark
