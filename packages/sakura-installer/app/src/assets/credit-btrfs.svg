    <rect x="22" y="10" width="70" height="30" rx="6" opacity="0.35"/>
    <rect x="30" y="17" width="70" height="30" rx="6" opacity="0.6"/>
    <rect x="38" y="24" width="70" height="30" rx="6"/>
  </g>
  <circle cx="52" cy="39" r="3.2" fill="#e87f9e"/>
  <circle cx="64" cy="39" r="3.2" fill="#e87f9e"/>
  <circle cx="76" cy="39" r="3.2" fill="#e87f9e"/>
</svg>
