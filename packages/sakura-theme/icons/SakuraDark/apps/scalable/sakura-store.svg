<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffadbf"/>
      <stop offset="100%" stop-color="#d95d81"/>
    </linearGradient>
  </defs>
  <!-- A bag, and only a bag. The first attempt put the full five-petal mark on
       top of it and the mark won: at 22px it read as a flower, not a store.
       The palette is what makes it ours; repeating the logo on every icon is
       the over-branding that makes a set look like clip-art. -->
  <path d="M17.5 16v-2.5a6.5 6.5 0 0 1 13 0V16" fill="none" stroke="#f4a0b6"
        stroke-width="3.2" stroke-linecap="round"/>
  <path d="M9 16h30l-2.4 22.6A3.4 3.4 0 0 1 33.2 42H14.8a3.4 3.4 0 0 1-3.4-3.4L9 16Z"
        fill="url(#bag)"/>
  <!-- A single notched petal, small, where a shop's tag would sit. -->
  <path d="M24 23 C20.6 26.4 20 31.4 22.3 33.8 C23.2 34.6 23.7 33.1 24 32.2
           C24.3 33.1 24.8 34.6 25.7 33.8 C28 31.4 27.4 26.4 24 23 Z"
        fill="#fff4f7" fill-opacity="0.92" transform="rotate(180 24 28.4)"/>
</svg>
