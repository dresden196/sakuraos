<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffc9d6"/>
      <stop offset="100%" stop-color="#d95d81"/>
    </linearGradient>
  </defs>
  <!-- An open circular arrow. The blossom that used to sit in the middle
       turned the whole thing into a pinwheel at small sizes, because the ring
       and the petals read as one shape. The centre stays nearly empty so the
       gap in the ring, which is the part that says "still going", survives
       down to 16px. -->
  <path d="M39 24a15 15 0 1 1-5.2-11.4" fill="none" stroke="url(#ring)"
        stroke-width="5.5" stroke-linecap="round"/>
  <path d="M39 8.5V19h-10.5" fill="none" stroke="url(#ring)"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="24" r="4.2" fill="#f4a0b6" fill-opacity="0.55"/>
</svg>
