<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- userSpaceOnUse, not the objectBoundingBox default. A perfectly
         vertical or horizontal stroke has a zero-width bounding box, and an
         objectBoundingBox gradient on one paints nothing at all: the stem of
         this arrow simply vanishes. Spanning the viewBox also keeps one ramp
         across all three strokes instead of restarting it per path. -->
    <linearGradient id="uc" gradientUnits="userSpaceOnUse" x1="6" y1="6" x2="42" y2="42">
      <stop offset="0%" stop-color="#ffc9d6"/>
      <stop offset="100%" stop-color="#d95d81"/>
    </linearGradient>
  </defs>
  <!-- An arrow coming down into a tray, meaning "install the updates". The
       circular arrow this replaces meant "refresh", and with a dot in the
       middle it read as a disc rather than as an arrow at all. A ring also
       loses its gap at 16px, which is the size on the panel, where this has
       to work. -->
  <path d="M24 6v22" fill="none" stroke="url(#uc)"
        stroke-width="5.5" stroke-linecap="round"/>
  <path d="M14 19l10 10 10-10" fill="none" stroke="url(#uc)"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M9 34v4a4 4 0 0 0 4 4h22a4 4 0 0 0 4-4v-4" fill="none" stroke="url(#uc)"
        stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
