# Login screen appearance and greeter, for live media and installed systems
# alike.
#
# Without an explicit theme SDDM falls back to its own default, which looks
# nothing like Plasma and is the very first thing anyone sees of the system.
# breeze ships with plasma-desktop, so this costs nothing.
[Theme]
Current=breeze

# Wayland greeter. Sakura is Wayland by default, and this avoids dragging the
# whole Xorg server onto a machine purely to draw a login screen.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --no-lockscreen --no-global-shortcuts --locale1
