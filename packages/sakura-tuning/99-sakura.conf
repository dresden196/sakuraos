# Memory-management defaults, taken from the CachyOS kernel's own patches.
#
# Each of these exists upstream as a compiled-in default that CachyOS changes
# in its tree. They are all writable at runtime, so we set them here instead of
# carrying a patched kernel to do it -- same values, no fork, and revertible on
# any machine that dislikes them by deleting one file.
#
# Source: github.com/CachyOS/linux, commits tagged "CACHY:". GPL-2.0.
# See docs/kernel.md for the full accounting of which of their changes are
# reachable this way and which are not.

# Watermark boosting reclaims extra pages beyond the high watermark to keep
# large contiguous blocks available. On a desktop it mostly evicts a working
# set that was about to be used again. CachyOS: "Disable watermark boosting by
# default". Arch default: 15000.
vm.watermark_boost_factor = 0

# Proactive compaction defragments memory in the background on a schedule
# rather than on demand. The work is real and the benefit on a desktop is not.
# CachyOS: "Disable proactive compaction by default". Arch default: 20.
vm.compaction_proactiveness = 0

# Page fault latency under contention. Lower means a waiting task is handed the
# lock sooner rather than the holder being allowed to keep re-acquiring it,
# which is the difference between a hitch and a stall when memory is tight.
vm.page_lock_unfairness = 1

# ---- the rest of what CachyOS tunes outside the kernel -----------------------
#
# Taken from CachyOS-Settings' own sysctl drop-in rather than from a generic
# "Linux tuning" list. Almost every such list is written for servers, and the
# advice inverts on a desktop: they say lower swappiness to 10, CachyOS raises
# it to 100, and we go further to 180 -- because swapping to compressed RAM is
# nothing like seeking a disk. Ours is set with the zram configuration in
# sakura-settings-core, where it belongs.

# Directory and inode metadata. The default of 100 reclaims it as eagerly as
# page cache; halving that keeps more of it around on a machine that walks the
# same source tree or media library repeatedly. Never 0 -- that stops reclaim
# entirely and ends in OOM.
vm.vfs_cache_pressure = 50

# Writeback thresholds in bytes rather than percentages. The percentage form
# scales with RAM, so the same 10% that flushes promptly on an 8 GB laptop is
# 6 GB of dirty pages on a 64 GB workstation, and flushing that at once stalls
# the machine. Absolute values behave the same everywhere.
# Setting the _bytes form disables the matching _ratio form.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864

# How often the flusher threads wake, in hundredths of a second. Raised from
# the default 500, not lowered: fewer wakeups is better for idle power, and
# writeback timing is a throughput knob, never a durability guarantee. What
# protects data across a power cut is fsync and a journal, not this number.
vm.dirty_writeback_centisecs = 1500

# The NMI watchdog exists to catch hard lockups. It costs a timer on every CPU
# and, on a desktop, the failure it detects is one the user experiences anyway.
kernel.nmi_watchdog = 0

# Receive queue for packets arriving faster than the kernel can process them.
# The default of 1000 predates gigabit being ordinary.
net.core.netdev_max_backlog = 4096

# Not tuning: kernel pointers are hidden from unprivileged readers in /proc.
# CachyOS ships this and it costs nothing here.
kernel.kptr_restrict = 2
