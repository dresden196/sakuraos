# Memory-management defaults, taken from the CachyOS kernel's own patches.
#
# Each of these exists upstream as a compiled-in default that CachyOS changes
# in its tree. They are all writable at runtime, so we set them here instead of
# carrying a patched kernel to do it -- same values, no fork, and revertible on
# any machine that dislikes them by deleting one file.
#
# Source: github.com/CachyOS/linux, commits tagged "CACHY:". GPL-2.0.
# See docs/kernel.md for the full accounting of which of their changes are
# reachable this way and which are not.

# Watermark boosting reclaims extra pages beyond the high watermark to keep
# large contiguous blocks available. On a desktop it mostly evicts a working
# set that was about to be used again. CachyOS: "Disable watermark boosting by
# default". Arch default: 15000.
vm.watermark_boost_factor = 0

# Proactive compaction defragments memory in the background on a schedule
# rather than on demand. The work is real and the benefit on a desktop is not.
# CachyOS: "Disable proactive compaction by default". Arch default: 20.
vm.compaction_proactiveness = 0

# Page fault latency under contention. Lower means a waiting task is handed the
# lock sooner rather than the holder being allowed to keep re-acquiring it,
# which is the difference between a hitch and a stall when memory is tight.
vm.page_lock_unfairness = 1
