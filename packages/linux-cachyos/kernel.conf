# The kernel SakuraOS ships, and the exact source it is built from.
#
# Read by build/build-kernel.sh. Everything here is an override of a default
# in CachyOS's own PKGBUILD, applied through the environment rather than by
# editing their file -- see README.md for why that distinction matters.

# Pinned by commit. Their tags lag badly: at the time of pinning the newest
# tag was 6.17.9 while master was on 7.2.x, so a tag is not a release here.
# Bumping this is a deliberate act: change it, read the diff, rebuild.
KERNEL_REPO="https://github.com/CachyOS/linux-cachyos.git"
KERNEL_COMMIT="bd8a07da314743eede668d999d37253c1a77c186"   # 7.2.2-1, 2026-08-28
KERNEL_VARIANT="linux-cachyos"                              # BORE + sched-ext
KERNEL_PKGBASE="linux-cachyos"

# The kernel tarball is PGP-signed as well as checksummed, and these are the
# keys allowed to have signed it. Taken from validpgpkeys in the PKGBUILD at
# the pinned commit, so trusting them is exactly as strong as trusting the
# pin and no stronger. Full fingerprints, never short ids: a short id is not
# unique and is trivially collided.
KERNEL_PGP_KEYS="E18447AC260021D31F3FF6C4C8A2A4774B8B63C4 E8B9AA39F054E30E8290D492C3C4820857F654FE"
#                Eric Naim <dnaim@cachyos.org>            Peter Jung <admin@ptr1337.dev>

# x86-64-v3, and this is a correctness requirement rather than a tuning
# choice. Left empty -- their default -- the PKGBUILD enables X86_NATIVE_CPU
# and compiles for whatever CPU the build machine happens to have, which
# produces a kernel that boots on the builder and nowhere else. GENERIC_V3 is
# the value their own release script uses for the v3 repository.
export _processor_opt=GENERIC_V3

# Their defaults, named here rather than inherited silently, so that a change
# upstream shows up as a diff in this file instead of a different kernel.
export _cpusched=cachyos      # BORE, with sched-ext available
export _use_llvm_lto=thin     # Clang ThinLTO
export _cc_harder=yes         # -O3
export _HZ_ticks=1000
export _tickrate=full
export _preempt=full
export _hugepage=always
export _use_lto_suffix=no     # keeps the package named linux-cachyos
export _use_gcc_suffix=yes

# Not ours to ship. ZFS is a licence question we have not answered, the open
# NVIDIA module duplicates a driver we already package, and r8125 is a
# vendor network module nobody has asked for. All three also lengthen a build
# that is already the longest thing in this repository.
export _build_zfs=no
export _build_nvidia_open=no
export _build_r8125=no
export _build_debug=no
