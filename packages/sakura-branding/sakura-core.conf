# SakuraOS packages take priority over upstream Arch. This file is what makes
# a machine a SakuraOS machine rather than an Arch machine with extra packages,
# so it must be included before [core] in pacman.conf.
#
# Two servers, deliberately. pacman walks them in order and moves to the next
# when one fails, so the bare-IP line is what keeps updates flowing if DNS
# stops resolving or the certificate expires unnoticed. That is not a
# theoretical worry: this file IS the update path, and a machine that cannot
# reach it has no way to be told where to look instead.
#
# It is safe to fall back to an IP because transport is not what makes this
# trustworthy -- the database and every package are GPG-signed and pacman
# verifies them either way, which is why Arch's own mirrors are largely HTTP.
# A hostile host on that address can refuse to answer; it cannot hand out a
# package we would install.
#
# The IP line is transitional. Drop it once enough installs have moved to the
# name that losing it would be noticed quickly.
[sakura-core]
SigLevel = Required DatabaseRequired
Server = https://repo.sakuraos.org/$repo/os/$arch
Server = http://173.233.87.167/$repo/os/$arch

# Hardware support too large to put on every ISO -- currently the frozen
# NVIDIA 580xx branch, which is the only driver left for Pascal and Maxwell
# cards. Fetched over the network when the installer detects one.
[sakura-extra]
SigLevel = Required DatabaseRequired
Server = https://repo.sakuraos.org/$repo/os/$arch
Server = http://173.233.87.167/$repo/os/$arch
