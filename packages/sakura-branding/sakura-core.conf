# SakuraOS packages take priority over upstream Arch. This file is what makes
# a machine a SakuraOS machine rather than an Arch machine with extra packages,
# so it must be included before [core] in pacman.conf.
[sakura-core]
SigLevel = Required DatabaseRequired
Server = https://repo.sakuraos.org/$repo/os/$arch

# Hardware support too large to put on every ISO -- currently the frozen
# NVIDIA 580xx branch, which is the only driver left for Pascal and Maxwell
# cards. Fetched over the network when the installer detects one.
[sakura-extra]
SigLevel = Required DatabaseRequired
Server = https://repo.sakuraos.org/$repo/os/$arch
