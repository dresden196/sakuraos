# SakuraOS packages take priority over upstream Arch. This file is what makes
# a machine a SakuraOS machine rather than an Arch machine with extra packages,
# so it must be included before [core] in pacman.conf.
#
# The repository by name only. There was a second line with the server's bare
# IP address, as a fallback for DNS failing or a certificate expiring. It was
# meant to be temporary, and it became a liability: the address is about to
# change hands in a renumbering, and whoever holds it next would receive every
# SakuraOS machine's package requests, in plain HTTP, whenever its DNS
# faltered. Signatures mean they could not hand out a package we would
# install, but the requests themselves say what each machine runs.
#
# Transport is still not what makes this trustworthy -- the database and every
# package are GPG-signed and pacman verifies them either way.
[sakura-core]
SigLevel = Required DatabaseRequired
Server = https://repo.sakuraos.org/$repo/os/$arch

# What not every machine needs: the frozen NVIDIA 580xx branch, the only
# driver left for Pascal and Maxwell cards, and the browsers the installer
# offers that Arch does not package. Rebuilt from the AUR and signed by us.
[sakura-extra]
SigLevel = Required DatabaseRequired
Server = https://repo.sakuraos.org/$repo/os/$arch
