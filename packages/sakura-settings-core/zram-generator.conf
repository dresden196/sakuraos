# Compressed swap in RAM, rather than a swap partition.
#
# A machine with no swap at all does not degrade under memory pressure, it
# gets a process killed. zram gives the kernel somewhere to put cold pages at
# memory speed, which is what keeps a 8 GB laptop usable with a browser open.
#
# Half of RAM, capped at 8 GB: zstd typically reaches 3-4x on anonymous pages,
# so this buys considerably more headroom than its size suggests, and the cap
# stops a 64 GB workstation reserving something absurd.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
