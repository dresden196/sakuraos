# Tuned for zram rather than a disk swap partition.
#
# The stock values assume swapping means seeking a spinning disk. Swapping to
# compressed RAM is orders of magnitude cheaper, so the kernel should be far
# more willing to do it, and should stop reading ahead for pages that cost
# nothing to fetch individually.
vm.swappiness = 180
# watermark_boost_factor is set in sakura-tuning with the rest of the
# memory-management values, rather than in both files where a later edit
# to one would be silently overridden by the other.
vm.watermark_scale_factor = 125
vm.page-cluster = 0
