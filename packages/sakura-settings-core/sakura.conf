# SakuraOS system settings.
#
# KConfig INI format, so the System Settings module reads and writes this file
# directly rather than inventing a parallel config format. Everything that
# enforces policy -- pacman hooks, the shell integration, the update timer --
# reads this same file, so the UI and the enforcement can never disagree about
# what is switched on.
#
# Edit by hand if you like. System Settings will not clobber comments it did
# not write, but it will rewrite values.

[TerminalAssist]
# block  - refuse commands that would break the system, explain why, and print
#          the exact override needed to proceed anyway
# warn   - explain, then continue
# off    - no checking
Mode=block

[AUR]
# The AUR is off by default. It is unreviewed third-party build scripts, and a
# new SakuraOS user has not agreed to that yet.
Enabled=false

# Show what a package's build script does before it runs, and what changed
# since the last version you accepted. Package takeover is the dominant real
# AUR attack, so the diff is the highest-signal check available.
ReviewBeforeInstall=true

# Check installed packages against published attack campaigns. This is exact
# but retrospective -- it cannot detect an attack nobody has reported yet.
KnownCampaignScanning=true
CampaignScanSchedule=daily

# Which AUR helper to expose on the command line. 'none' installs no helper,
# so the AUR is reachable only through the store.
Helper=yay

[Updates]
# Apply automatically, but only what the canary fleet has already installed
# and boot-tested, and only when no Arch News manual intervention applies.
# Everything else is surfaced for the user to decide.
AutoApply=true
RequireCanaryEvidence=true

# Off-hours window, and only on mains power -- an update that runs the battery
# flat mid-transaction is the failure this avoids.
Window=03:00
WindowDuration=120
RequireACPower=true

# Never reboot on the user's behalf. Say clearly that a restart is needed and
# let them pick the moment.
AutoReboot=false

[Store]
# Applications from Flatpak, Snap and AppImage, kept current on their own.
#
# Separate from Updates above, and deliberately so: that section is about the
# operating system, which is replaced wholesale by pacman and bracketed by a
# snapshot. An application updating itself is a smaller thing with a smaller
# blast radius, and someone can reasonably want one without the other.
#
# Repository applications are not touched here. They come with the system
# update, inside its snapshot, where they belong.
AutoUpdate=true
